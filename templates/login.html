<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    (function () {
      document.documentElement.dataset.theme = localStorage.getItem("suf-theme") || "dark";
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="suf-app flex items-center justify-center h-screen bg-gray-100">
  <button type="button" class="theme-toggle theme-toggle--floating" onclick="toggleSufTheme()" aria-label="Toggle theme">
    <span class="theme-toggle__dot"></span>
    <span id="themeToggleText">Theme</span>
  </button>
  <div class="bg-white p-6 rounded shadow w-80">
    <h1 class="text-xl font-bold mb-4">Вход</h1>
    <form method="post">
      <div class="mb-3">
        <label class="block text-sm font-medium">Логин</label>
        <input type="text" name="login" class="border px-2 py-1 w-full rounded" required>
      </div>
      <div class="mb-3">
        <label class="block text-sm font-medium">Пароль</label>
        <input type="password" name="password" class="border px-2 py-1 w-full rounded" required>
      </div>
      <button type="submit" class="bg-blue-600 text-white px-3 py-1 rounded w-full">Войти</button>
    </form>
  </div>
  <script>
    function setSufTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("suf-theme", theme);
      const label = document.getElementById("themeToggleText");
      if (label) label.textContent = theme === "dark" ? "Dark" : "Light";
    }

    function toggleSufTheme() {
      const current = document.documentElement.dataset.theme || "dark";
      setSufTheme(current === "dark" ? "light" : "dark");
    }

    setSufTheme(localStorage.getItem("suf-theme") || "dark");
  </script>
</body>
</html>
